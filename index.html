<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COD3S</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
            color: #fff;
            overflow-x: hidden;
        }

        h1 {
            font-size: 5rem;
            margin: 0 0 40px 0; 
            text-align: center;
            line-height: 1; 
            text-shadow: 2px 2px 10px #ff8c00, 0 0 20px #ff4500;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        input[type="text"] {
            padding: 15px;
            font-size: 1.5rem;
            width: 300px;
            text-align: center;
            border: 2px solid #ff8c00;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff4500;
            box-shadow: 0 0 10px #ff4500;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            background: #ff8c00;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px #ff8c00;
        }

        button:hover {
            background: #ff4500;
            box-shadow: 0 0 15px #ff4500;
        }

        p {
            margin-top: 20px;
            font-size: 1rem;
            color: #ddd;
            text-align: center;
        }

        #output {
            margin-top: 30px;
            font-size: 1.5rem;
            min-height: 50px;
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        /* Carrot image */
        #carrotImage {
            width: 220px;
            height: 220px;
            cursor: pointer;
            display: none; 
            position: absolute;
            left: -400px; 
            top: 50%;
            transform: translateY(-50%);
        }

        /* COD3S Page secret */
        #cod3sContainer {
            position: absolute;
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(400px, -50%);
        }

        #cod3sImage {
            width: 255px;
            height: 300px;
            cursor: pointer;
            display: block;
            position: relative;
        }

        #cod3sText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            font-size: 1rem;
            color: #ffffff;
            text-shadow: 1px 1px 5px #000;
        }

        /* TVtime Player */
        #tvPlayer {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 400px;
            height: 230px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 2px solid #ff8c00;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff4500;
            z-index: 10000;
        }

        #tvPlayer video {
            width: 100%;
            height: 200px;
            border-radius: 6px;
        }

        #tvPlayer button {
            background: #ff8c00;
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            padding: 5px 12px;
        }

        #tvPlayer button:hover {
            background: #ff4500;
        }
    </style>
</head>
<body>
    <h1>COD3S</h1>

    <div class="input-container">
        <img id="carrotImage" src="https://file.garden/Z-CUTZ9vlwLEFzWU/CarrotSticker.png" alt="Carrot Sticker">
        <input type="text" id="inputBox" placeholder="Type something..." />
        <button id="goButton">Go</button>
    </div>

    <p>Type Cool things and cool things appear! Here's a code: Carrot</p>
    <div id="output"></div>

    <!-- Carrot Sound -->
    <audio id="carrotSound" src="https://file.garden/Z-CUTZ9vlwLEFzWU/Carrot.mp3"></audio>

    <!-- COD3S Page Secret -->
    <div id="cod3sContainer">
        <img id="cod3sImage" src="https://file.garden/Z-CUTZ9vlwLEFzWU/Page.png" alt="COD3S Page">
        <div id="cod3sText"></div>
    </div>

    <!-- TVtime Player -->
    <div id="tvPlayer">
        <video id="tvVideo" controls></video>
        <div>
            <button id="prevBtn">Previous Video</button>
            <button id="nextBtn">Next Video</button>
        </div>
    </div>

    <script>
        const goButton = document.getElementById('goButton');
        const inputBox = document.getElementById('inputBox');
        const outputDiv = document.getElementById('output');
        const carrotImage = document.getElementById('carrotImage');
        const carrotSound = document.getElementById('carrotSound');
        const cod3sContainer = document.getElementById('cod3sContainer');
        const cod3sImage = document.getElementById('cod3sImage');
        const cod3sText = document.getElementById('cod3sText');
        const tvPlayer = document.getElementById('tvPlayer');
        const tvVideo = document.getElementById('tvVideo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let carrotFound = false;
        const cod3sTexts = [
            "I like carrots",
            "Did you know? Geometry Dash was inspired by Joe Metri Dash, who had to jump spikes for sport.",
            "This is a placeholder!",
            "Webi wabu",
            "What. (By Spunix)",
            "gstgd iaaue tfgtytidtuasgt ay ygu gt e4674 eie47 egsgaia e1111111111111",
            "I like car",
            "Whoa stop right there pal, ur clicking too good.",
            "This program was brought to you by Blocky's Funny Doings International.",
            "insert text here",
            "Psst, Type gullible for a free Code!",
            "Hey, By the way, type TVtime for some entertainment!"
        ];

        let cod3sLastIndex = -1;
        function getRandomCod3sText() {
            if (cod3sTexts.length === 1) return cod3sTexts[0];
            let index;
            do {
                index = Math.floor(Math.random() * cod3sTexts.length);
            } while (index === cod3sLastIndex);
            cod3sLastIndex = index;
            return cod3sTexts[index];
        }

        // TVtime video list
        const videos = [
            "https://file.garden/Z-CUTZ9vlwLEFzWU/Minecraft%20parkour%20gameplay%201%20minute.mp4",
            "https://file.garden/Z-CUTZ9vlwLEFzWU/Top%205%20Top%205%20Scariest%20Jumpscares.mp4",
            "https://file.garden/Z-CUTZ9vlwLEFzWU/Anarchy%20Chess_%20Reddit's%20Greatest%20Sh_tpost.mp4",
            "https://file.garden/Z-CUTZ9vlwLEFzWU/BFDI%201a_%20Take%20the%20Plunge.mp4",
            "https://file.garden/Z-CUTZ9vlwLEFzWU/Nothing%20Beats%20a%20Jet2holiday%20_%20Sale%20_%20Family%20_%20TV%20advert.mp4",
            "https://file.garden/Z-CUTZ9vlwLEFzWU/A%20Podcast%20That%20Makes%20The%20Sign%20Guy%20Say%20Something%20Different.mp4"
        ];
        let currentVideo = 0;

        function showTVTime() {
            tvPlayer.style.display = "flex";
            tvVideo.src = videos[currentVideo];
        }

        nextBtn.addEventListener("click", () => {
            currentVideo = (currentVideo + 1) % videos.length;
            tvVideo.src = videos[currentVideo];
        });
        prevBtn.addEventListener("click", () => {
            currentVideo = (currentVideo - 1 + videos.length) % videos.length;
            tvVideo.src = videos[currentVideo];
        });

        // Recursive mini screen function
        function createMiniScreen(level, maxLevel, parent) {
            if (level > maxLevel) return;

            const iframe = document.createElement('iframe');
            iframe.srcdoc = document.documentElement.outerHTML;
            iframe.style.position = "absolute";
            iframe.style.bottom = "20px";
            iframe.style.right = "20px";
            iframe.style.width = `${300 * Math.pow(0.75, level - 1)}px`;
            iframe.style.height = `${200 * Math.pow(0.75, level - 1)}px`;
            iframe.style.border = "2px solid #ff8c00";
            iframe.style.borderRadius = "10px";
            iframe.style.overflow = "hidden";
            iframe.style.transformOrigin = "bottom right";
            iframe.style.zIndex = 9999 - level;

            parent.appendChild(iframe);

            iframe.onload = () => {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                const iframeScript = iframeDoc.createElement("script");
                iframeScript.textContent = `
                    (${createMiniScreen.toString()})(${level + 1}, ${maxLevel}, document.body);
                `;
                iframeDoc.body.appendChild(iframeScript);
            };
        }

        // Main input handler
        function handleInput() {
            const userInput = inputBox.value.trim();

            if (userInput.toLowerCase() === "carrot") {
                carrotFound = true;
            }
            carrotImage.style.display = carrotFound ? "block" : "none";
            outputDiv.textContent = carrotFound ? "You found the Carrot!" : "";

            if (userInput === "COD3S") {
                cod3sContainer.style.display = "block";
                cod3sText.textContent = getRandomCod3sText();
            }

            if (userInput.toLowerCase() === "tvtime") {
                showTVTime();
            }

            if (userInput === "Type something...") {
                createMiniScreen(1, 6, document.body);
                outputDiv.textContent = "Recursive screen created!";
            }
        }

        goButton.addEventListener('click', handleInput);
        inputBox.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleInput();
        });

        carrotImage.addEventListener('click', () => {
            carrotSound.currentTime = 0;
            carrotSound.play();
        });

        cod3sImage.addEventListener('click', () => {
            cod3sText.textContent = getRandomCod3sText();
        });
    </script>
</body>
</html>
